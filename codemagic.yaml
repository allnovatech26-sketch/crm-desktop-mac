# Codemagic (Mac M2, minutos gratis de cuenta personal): arma los .dmg de Mac.
# Se lanza a mano desde Codemagic («Start new build»). La versión sale de package.json
# salvo que se defina la variable VERSION al lanzar.
workflows:
  mac:
    name: ALLNOVATECH CRM para Mac
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
    scripts:
      - name: Armar, firmar ad hoc, .dmg y prueba de arranque
        script: |
          V="${VERSION:-$(node -p "require('./package.json').version")}"
          bash scripts/armar-mac.sh "$V"
    artifacts:
      - salida-mac/*.dmg
      - salida-mac/SHA512SUMS
      - salida-mac/VERSION
