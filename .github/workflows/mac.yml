name: Armar para Mac

# git tag v0.1.26 && git push origin v0.1.26  →  Release con los .dmg (Apple Silicon e Intel)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Armar, firmar ad hoc, .dmg y prueba de arranque
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || V=$(node -p "require('./package.json').version")
          bash scripts/armar-mac.sh "$V"
          echo "V=$V" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: crm-mac-${{ env.V }}
          path: salida-mac/*
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" salida-mac/* --title "ALLNOVATECH CRM para Mac $V" --notes "Instaladores para Mac (Apple Silicon e Intel). Se conectan a la PC principal con Windows."
